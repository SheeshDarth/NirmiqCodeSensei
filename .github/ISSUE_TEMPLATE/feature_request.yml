name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        NirmiqCodeSensei is deliberately local-first and minimal — features that require a
        cloud service, telemetry, or a heavy new dependency are unlikely to be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the learning or workflow gap, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This works fully offline (no cloud service required)
        - label: This adds no telemetry or tracking
