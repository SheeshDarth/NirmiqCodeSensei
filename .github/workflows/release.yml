name: Release

# Runs only when the maintainer pushes a version tag (e.g. v1.0.0). Nothing here
# publishes on an ordinary push or pull request.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)" >&2
            exit 1
          fi

      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical

      # prepack rebuilds, packs the standalone server (publish-guard refuses to
      # continue if a database, .env or native binary slipped in) and bundles MCP.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" sbom.cdx.json --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
